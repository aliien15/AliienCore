version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "aliien15"
    ignore:
      - dependency-name: "com.h2database:h2"
      - dependency-name: "io.papermc.paper:paper-api"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "aliien15"
    commit-message:
      prefix: "chore"
